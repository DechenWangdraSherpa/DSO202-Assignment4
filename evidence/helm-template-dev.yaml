# Source: tasktracker/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    helm.sh/chart: tasktracker-0.4.0
    app: task-tracker
    tier: backend
    app.kubernetes.io/instance: tasktracker
    app.kubernetes.io/managed-by: Helm
    dso202/assignment: "04"
    dso202/environment: "dev"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # C6: a stuck rollout is reported as failed (Degraded) after 120 s.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        helm.sh/chart: tasktracker-0.4.0
        app: task-tracker
        tier: backend
        app.kubernetes.io/instance: tasktracker
        app.kubernetes.io/managed-by: Helm
        dso202/assignment: "04"
        dso202/environment: "dev"
      annotations:
        checksum/config: 13498cd077751b94f9fec6cf6fa011521fe001bc69ae89463719ebe0381fba00
    spec:
      serviceAccountName: tasktracker
      containers:
        - name: api
          image: "dwangshers/dso202-amd64-backend:1.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: {name: app-config, key: DB_HOST}
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: {name: app-config, key: DB_PORT}
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: {name: app-config, key: DB_NAME}
            - name: APP_PORT
              valueFrom:
                configMapKeyRef: {name: app-config, key: APP_PORT}
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef: {name: app-config, key: CORS_ORIGIN}
            # C3: credentials from the existing Secret named by a value.
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: tasktracker-credentials, key: DB_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: tasktracker-credentials, key: DB_PASSWORD}
            # C2: per-tier variables from values (backend.env).
            
            - name: DB_SSLMODE
              value: "disable"
          # C4: GET /api/status answers 200 only when the database is reachable.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

